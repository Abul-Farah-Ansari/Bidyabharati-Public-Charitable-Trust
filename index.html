<!doctype html>
<html lang="en">
  <head>
    <!-- =========================================
         BASIC
    ========================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#123d2b"

    <meta
      name="color-scheme"
      content="light"

    <!-- =========================================
         SEO TITLE
    ========================================== -->

    <title>
      Bidyabharati Public Charitable Trust | Education, Health & Social Awareness

    ========================================== -->

    <meta

      content="Bidyabharati Public Charitable Trust works for community development through child education, blood donation camps, health awareness, environmental initiatives and social awareness."

    <meta

      name="author"

    />

    ========================================== -->

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

         FAVICON

         src/assets/favicon.png
    ========================================== -->

    <link
      rel="icon"

    />

    <link
      rel="apple-touch-icon"
      href="/src/assets/favicon.png"
    />

    />

      property="og:title"
      content="Bidyabharati Public Charitable Trust"
    />

    <meta

      property="og:image"
      content="/src/assets/favicon.png"
    />

    <meta
      property="og:image:alt"
      content="Bidyabharati Public Charitable Trust"
    />

    <meta
      property="og:site_name"
      content="Bidyabharati Public Charitable Trust"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <!--
      Add your real domain here after deployment:

      <meta

      name="twitter:title"

      name="twitter:description"
      content="Community initiatives focused on education, health, blood donation, environmental awareness and social awareness."

      name="twitter:image"
      content="/src/assets/favicon.png"
    />
